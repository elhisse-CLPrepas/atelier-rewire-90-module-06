name: Valider le mini-site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle-structurel:
    name: Contrôle structurel
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier le JavaScript
        run: node --check 02-mini-site-v2/js/app.js

      - name: Exécuter les 12 contrôles du pack
        run: node 03-tests/test-structure.mjs
